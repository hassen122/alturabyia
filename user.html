<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>المكتبة الترابية |  </title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root[data-theme="light"] { 
            --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --accent: #059669; --border: #e2e8f0; --shadow: 0 15px 30px -10px rgba(0,0,0,0.06);
            --highlight: #fde047; 
        }
        :root[data-theme="dark"] { 
            --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #34d399; --border: #334155; --shadow: 0 15px 30px -10px rgba(0,0,0,0.5);
            --highlight: #059669;
        }
        :root[data-theme="sepia"] { 
            --bg: #f5f5dc; --card: #fdf6e3; --text: #5d4037; --accent: #d97706; --border: #e6dbb9; --shadow: 0 15px 30px -10px rgba(93, 64, 55, 0.1);
            --highlight: #fbbf24;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; scroll-behavior: smooth; }
        
        body { 
            background: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; 
            transition: background-color 0.4s ease, color 0.4s ease; 
            overflow-x: hidden; 
        }

        input { font-size: 16px !important; }

        .f-card { 
            background: var(--card); border-radius: 22px; height: 160px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            position: relative; border: 1px solid var(--border); box-shadow: var(--shadow); 
            cursor: pointer; transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .f-card:active { transform: scale(0.96); }
        
        .theme-btn-icon { display: inline-block; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .theme-btn-active .theme-btn-icon { transform: scale(1.2) rotate(360deg); }

        .breadcrumbs { display: flex; align-items: center; gap: 6px; overflow-x: auto; white-space: nowrap; padding-bottom: 5px; }
        .crumb-item { opacity: 0.5; font-size: 0.8rem; cursor: pointer; }
        .crumb-current { font-weight: bold; opacity: 1; color: var(--accent); }

        #reader { position: fixed; inset: 0; background: var(--bg); z-index: 200; display: none; flex-direction: column; }
        #progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.1s; }
        #reader-header { position: absolute; top: 0; width: 100%; z-index: 50; background: var(--card); border-bottom: 1px solid var(--border); transition: transform 0.3s ease; }
        .header-hidden { transform: translateY(-100%); }

        .content-area { 
            font-family: 'Amiri', serif; font-size: 1.5rem; line-height: 2.3; padding: 7rem 2rem 5rem 2rem; 
            max-width: 850px; margin: 0 auto; text-align: justify; 
        }

        mark.search-highlight {
            background-color: var(--highlight); color: #000; padding: 0 2px; margin: 0; border-radius: 3px; display: inline;
            -webkit-box-decoration-break: clone; box-decoration-break: clone;
        }

        .search-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 400; display: none; flex-direction: column; animation: fadeIn 0.2s ease; }
        .search-tab { flex: 1; padding: 12px; text-align: center; font-size: 0.85rem; font-weight: 700; cursor: pointer; border-radius: 12px; opacity: 0.5; transition: 0.2s; }
        .search-tab.active { background: var(--card); color: var(--accent); opacity: 1; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body data-theme="light">

    <header class="h-28 px-5 flex flex-col justify-center sticky top-0 z-50 bg-[var(--bg)]/95 backdrop-blur-xl border-b border-[var(--border)]">
        <div class="flex justify-between items-center w-full">
            <div class="flex items-center gap-3">
                <button id="back-btn" onclick="goBack()" class="w-10 h-10 hidden items-center justify-center bg-[var(--card)] rounded-full border border-[var(--border)] text-[var(--accent)] shadow-sm">➔</button>
                <button onclick="goHome()" class="w-10 h-10 flex items-center justify-center bg-[var(--card)] rounded-full border border-[var(--border)] shadow-sm">📖</button>
                <h1 class="text-lg font-black"> المكتبة التُرَابيَّـة</h1>
            </div>
            <div class="flex gap-2">
                <button onclick="cycleTheme(this)" class="w-10 h-10 bg-[var(--card)] border border-[var(--border)] rounded-xl shadow-sm flex items-center justify-center">
                    <span class="theme-btn-icon text-lg">☀️</span>
                </button>
                <button onclick="openAdvancedSearch()" class="w-10 h-10 bg-[var(--accent)] text-white rounded-xl shadow-lg shadow-[var(--accent)]/30">🔍</button>
            </div>
        </div>
        <div id="breadcrumbs" class="breadcrumbs mt-2"></div>
    </header>

    <div id="grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 p-5 pb-24 max-w-7xl mx-auto"></div>

    <div id="advanced-search-ui" class="search-overlay">
        <div class="p-5 bg-[var(--bg)] border-b border-[var(--border)] shadow-sm space-y-4">
            <div class="flex justify-between items-center">
                <span class="font-bold text-[var(--accent)]">نظام البحث</span>
                <button onclick="closeAdvancedSearch()" class="w-9 h-9 bg-[var(--card)] rounded-full border border-[var(--border)]">✕</button>
            </div>
            <div class="flex bg-[var(--border)] p-1 rounded-xl gap-1">
                <div onclick="setSearchMode('folder')" id="tab-folder" class="search-tab active"> المجلدات</div>
                <div onclick="setSearchMode('titles')" id="tab-titles" class="search-tab">البحوث</div>
                <div onclick="setSearchMode('content')" id="tab-content" class="search-tab">المحتوى</div>
            </div>
            <input type="text" id="adv-input" oninput="runAdvancedSearch()" placeholder="اكتب للبحث..." 
                class="w-full p-3.5 bg-[var(--card)] border border-[var(--border)] rounded-xl outline-none font-bold shadow-sm focus:border-[var(--accent)]">
        </div>
        <div id="adv-results" class="flex-1 overflow-y-auto p-5 space-y-3"></div>
    </div>

    <div id="reader">
        <div id="reader-header" class="h-16 flex items-center px-4 justify-between">
            <button onclick="closeReader()" class="w-10 h-10 bg-[var(--bg)] rounded-full border border-[var(--border)] z-50">✕</button>
            <h2 id="rtitle" class="text-[10px] font-bold truncate px-2 opacity-60 max-w-[40%]"></h2>
            <div class="flex gap-2 z-50">
                <button onclick="cycleTheme(this)" class="w-10 h-10 flex items-center justify-center bg-[var(--bg)] rounded-full border border-[var(--border)]">
                    <span class="theme-btn-icon text-lg">☀️</span>
                </button>
                <button onclick="toggleInternalSearch()" class="w-10 h-10 flex items-center justify-center bg-[var(--bg)] text-[var(--accent)] rounded-full border border-[var(--border)]">🔍</button>
            </div>
            <div class="absolute bottom-0 left-0 w-full h-[2px] bg-transparent"><div id="progress-bar"></div></div>
        </div>

        <div id="internal-search-panel" class="absolute top-16 left-0 right-0 bg-[var(--card)]/98 border-b border-[var(--border)] shadow-xl z-40 hidden flex-col p-4">
            <input type="text" id="i-input" oninput="runInternalSearch()" placeholder="ابحث داخل النص..." class="w-full p-3 bg-[var(--bg)] border border-[var(--border)] rounded-xl outline-none font-bold">
            <div id="i-results" class="max-h-60 overflow-y-auto mt-3 space-y-2"></div>
        </div>

        <div class="flex-1 overflow-y-auto" id="reader-scroll" onscroll="updateProgressBar()"><div id="rcontent" class="content-area"></div></div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyA3Qp8zzy6FIs1g5ed0HXBkd9FykxGvGR8", authDomain: "alturbya.firebaseapp.com", projectId: "alturbya", appId: "1:481479317412:web:8f070dbc4c87ba5aa59331" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let path = [{id:'root', name:'الرئيسية'}], allData = [], searchMode = 'folder', activeRes = null, isHeaderVisible = true;

        db.collection("research_tree").onSnapshot(snap => { allData = snap.docs.map(doc => ({id: doc.id, ...doc.data()})); renderGrid(); });

        function cycleTheme(btn) {
            const themes = ['light', 'sepia', 'dark'];
            const icons = { light: '☀️', sepia: '📜', dark: '🌙' };
            let cur = document.documentElement.getAttribute('data-theme') || 'light';
            let next = themes[(themes.indexOf(cur) + 1) % themes.length];
            if(btn) {
                btn.classList.add('theme-btn-active');
                setTimeout(() => btn.classList.remove('theme-btn-active'), 400);
            }
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('lib-theme', next);
            document.querySelectorAll('.theme-btn-icon').forEach(span => { span.innerText = icons[next]; });
        }

        function renderGrid() {
            const current = path[path.length-1];
            document.getElementById('back-btn').style.display = path.length > 1 ? 'flex' : 'none';
            document.getElementById('breadcrumbs').innerHTML = path.map((p, i) => `
                <span onclick="${i < path.length-1 ? `jumpToPath(${i})` : ''}" class="crumb-item ${i === path.length-1 ? 'crumb-current' : ''}">${p.name}</span>
                ${i < path.length-1 ? '<span class="opacity-30">/</span>' : ''}
            `).join('');
            const items = allData.filter(d => d.parentId === current.id);
            const grid = document.getElementById('grid');
            grid.innerHTML = items.length === 0 ? `<div class="col-span-full text-center py-20 opacity-30 text-sm">المجلد فارغ</div>` : "";
            items.sort((a,b) => a.type === 'folder' ? -1 : 1).forEach(d => {
                const card = document.createElement('div');
                card.className = `f-card ${d.type === 'folder' ? 'card-folder' : ''}`;
                card.innerHTML = `<div class="text-4xl mb-3">${d.type==='folder'?'📚':'📖'}</div><div class="text-xs font-bold text-center px-2 line-clamp-2">${d.name||d.t}</div>`;
                card.onclick = () => { if(d.type==='folder') { path.push({id:d.id, name:d.name}); renderGrid(); } else openReader(d); };
                grid.appendChild(card);
            });
        }

        function goBack() { if(path.length > 1) { path.pop(); renderGrid(); } }
        function goHome() { path = [{id:'root', name:'الرئيسية'}]; renderGrid(); }
        function jumpToPath(i) { path = path.slice(0, i + 1); renderGrid(); }

        /* --- وظائف البحث المحدثة --- */
        function openAdvancedSearch() { document.getElementById('advanced-search-ui').style.display = 'flex'; document.getElementById('adv-input').focus(); runAdvancedSearch(); }
        function closeAdvancedSearch() { document.getElementById('advanced-search-ui').style.display = 'none'; }
        function setSearchMode(m) { 
            searchMode = m; 
            document.querySelectorAll('.search-tab').forEach(t => t.classList.remove('active')); 
            document.getElementById(`tab-${m}`).classList.add('active'); 
            runAdvancedSearch(); 
        }

        // دالة تهريب الرموز الخاصة في البحث
        function escapeRegExp(string) { return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

        function runAdvancedSearch() {
            const q = document.getElementById('adv-input').value.trim();
            const resultsDiv = document.getElementById('adv-results');
            resultsDiv.innerHTML = "";
            const currentFolderId = path[path.length-1].id;
            let filtered = [];
            
            const lowerQ = q.toLowerCase();

            if (!q) {
                if (searchMode === 'folder') filtered = allData.filter(d => d.parentId === currentFolderId);
                else if (searchMode === 'titles') filtered = allData.filter(d => d.type === 'research').slice(0, 50);
            } else {
                if (searchMode === 'folder') filtered = allData.filter(d => d.parentId === currentFolderId && (d.name || d.t).toLowerCase().includes(lowerQ));
                else if (searchMode === 'titles') filtered = allData.filter(d => d.type === 'research' && d.t.toLowerCase().includes(lowerQ));
                else if (searchMode === 'content') filtered = allData.filter(d => d.type === 'research' && d.x && d.x.toLowerCase().includes(lowerQ));
            }

            filtered.forEach(d => {
                const div = document.createElement('div');
                div.className = "p-4 bg-[var(--card)] rounded-xl border border-[var(--border)] active:scale-95 transition-transform cursor-pointer";
                
                let snippet = "";
                if (searchMode === 'content' && q) {
                    const idx = d.x.toLowerCase().indexOf(lowerQ);
                    const start = Math.max(0, idx - 40);
                    const end = Math.min(d.x.length, idx + 40);
                    const highlighted = d.x.substring(start, end).replace(new RegExp(escapeRegExp(q), 'gi'), m => `<mark class="search-highlight">${m}</mark>`);
                    snippet = `<div class="text-[10px] opacity-60 mt-2 leading-relaxed">...${highlighted}...</div>`;
                }

                div.innerHTML = `<div class="flex items-center gap-3"><div class="text-xl">${d.type==='folder'?'📁':'📄'}</div><div class="text-sm font-bold">${d.name||d.t}</div></div>${snippet}`;
                div.onclick = () => { closeAdvancedSearch(); if(d.type==='folder'){ path.push({id:d.id, name:d.name}); renderGrid(); } else openReader(d, q); };
                resultsDiv.appendChild(div);
            });
        }

        /* --- القارئ المحدث --- */
        function openReader(d, q = "") {
            activeRes = d;
            const reader = document.getElementById('reader');
            const rContent = document.getElementById('rcontent');
            reader.style.display = 'flex';
            document.getElementById('rtitle').innerText = d.t;
            
            let body = d.x.replace(/\n/g, '<br>');
            
            if(q) {
                const escapedQ = escapeRegExp(q);
                const regex = new RegExp(`(${escapedQ})`, "gi");
                body = body.replace(regex, `<mark class="search-highlight" id="first-result">$1</mark>`);
            }
            
            rContent.innerHTML = `<h2 class="text-3xl font-black mb-10 text-center text-[var(--accent)]">${d.t}</h2>${body}`;
            
            const scrollArea = document.getElementById('reader-scroll');
            scrollArea.scrollTop = 0;
            
            // التمرير التلقائي لأول نتيجة بحث
            if(q) {
                setTimeout(() => {
                    const firstMark = document.getElementById('first-result');
                    if(firstMark) {
                        firstMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 300);
            }

            document.getElementById('reader-header').classList.remove('header-hidden');
            isHeaderVisible = true;
        }

        function closeReader() { document.getElementById('reader').style.display = 'none'; }
        
        function updateProgressBar() {
            const el = document.getElementById('reader-scroll');
            const scrolled = (el.scrollTop / (el.scrollHeight - el.clientHeight)) * 100;
            document.getElementById('progress-bar').style.width = scrolled + '%';
        }

        document.getElementById('reader-scroll').onclick = () => {
            isHeaderVisible = !isHeaderVisible;
            document.getElementById('reader-header').classList.toggle('header-hidden', !isHeaderVisible);
            document.getElementById('internal-search-panel').style.display = 'none';
        };

        function toggleInternalSearch() {
            const p = document.getElementById('internal-search-panel');
            p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
            if(p.style.display === 'flex') document.getElementById('i-input').focus();
        }

        function runInternalSearch() {
            const q = document.getElementById('i-input').value.trim();
            const res = document.getElementById('i-results');
            res.innerHTML = ""; if(!q) return;
            activeRes.x.split(/[.\n]/).filter(s => s.includes(q)).forEach(s => {
                const div = document.createElement('div');
                div.className = "bg-[var(--bg)] p-3 rounded-lg text-xs border border-[var(--border)] cursor-pointer";
                div.innerHTML = s.replace(new RegExp(escapeRegExp(q), 'g'), `<mark class="search-highlight">${q}</mark>`);
                div.onclick = () => { 
                    toggleInternalSearch(); 
                    openReader(activeRes, q);
                };
                res.appendChild(div);
            });
        }

        window.onload = () => {
            const saved = localStorage.getItem('lib-theme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);
            const icons = { light: '☀️', sepia: '📜', dark: '🌙' };
            document.querySelectorAll('.theme-btn-icon').forEach(icon => icon.innerText = icons[saved]);
        };
    </script>
</body>
    </html>
